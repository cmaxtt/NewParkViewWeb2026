{% extends "admin/base_admin.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1><i class="fas fa-prescription" style="color:var(--green);"></i> {{ settings.business_name }}</h1>
        <p>Admin Login</p>
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Enter admin username...">
            </div>
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter admin password...">
                <div class="hint">Use the administrator password configured for this installation.</div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
